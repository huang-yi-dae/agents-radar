name: Daily Agents Radar

on:
  schedule:
    # 每天 00:00 UTC = 08:00 CST (UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
            if ! git pull --rebase; then
              for f in $(git diff --name-only --diff-filter=U); do
                if [ "${f##*/}" = "highlights.json" ]; then
                  HFILE="$f" node -e 'const fs=require("fs"),cp=require("child_process");const p=process.env.HFILE;const rd=s=>JSON.parse(cp.execSync("git show :"+s+":"+p).toString());const mg=(a,b)=>{if(a===undefined)return b;if(b===undefined)return a;if(Array.isArray(a)&&Array.isArray(b))return [...new Set([...a,...b])];if(Array.isArray(a)||Array.isArray(b))return [...new Set([...a,...b])];if(a&&b&&typeof a==="object"&&typeof b==="object"){const r={};for(const k of new Set([...Object.keys(a),...Object.keys(b)]))r[k]=mg(a[k],b[k]);return r;}return b;};fs.writeFileSync(p,JSON.stringify(mg(rd(2),rd(3)),null,2)+"\n");'
                else
                  git checkout --theirs -- "$f"
                fi
                git add "$f"
              done
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            if ! git pull --rebase; then
              for f in $(git diff --name-only --diff-filter=U); do
                git checkout --theirs -- "$f"
                git add "$f"
              done
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://huang-yi-dae.github.io/agents-radar
        run: pnpm notify

